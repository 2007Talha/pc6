name: CI Quality & Build Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies
        run: npm install

      - name: Code Quality & Lint Audit
        run: npm run lint

      - name: Automated Multi-Tier Test Suite
        run: npm test

      - name: Production TypeScript & Vite Bundling
        run: npm run build
